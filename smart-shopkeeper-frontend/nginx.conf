server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads for model training
    client_max_body_size 50m;

    # Forward API calls to the backend container (service name "backend" from docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # model training can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # React single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}